spring.application.name=demo

# No context-path in tests so MockMvc paths stay simple.

retirement.cle.owners=CLE,CLE-TEAM

# --- Spring Batch ---
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

spring.datasource.url=jdbc:h2:mem:batchdb-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The scheduler must not fire during tests - it would advance case statuses
# underneath the integration assertions. Tests launch the job explicitly.
retirement.batch.scheduler.enabled=false